[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmind"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
 "python-multipart>=0.0.20", "markdown-it-py>=3,<5", "neo4j>=5.26,<6", "neo4j-graphrag>=1.7,<2",
 "torch>=2.6,<3", "sentence-transformers>=3.4,<6", "pymupdf>=1.25,<2", "httpx>=0.28,<1", "tenacity>=9,<10"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
include = ["backend*"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = ["integration: requires live Neo4j and embedding model", "live: requires explicit provider authorization"]
[tool.ruff]
line-length = 110

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
