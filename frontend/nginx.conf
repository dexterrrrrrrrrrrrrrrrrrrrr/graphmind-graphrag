server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 21m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
 # Swagger UI uses FastAPI's versioned CDN assets and a trusted inline bootstrap.
 location = /api/docs {
   proxy_pass http://backend:8000;
   add_header X-Content-Type-Options nosniff always;
   add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' https://fastapi.tiangolo.com data:; object-src 'none'; frame-ancestors 'none'" always;
 }
 location /api/ { proxy_pass http://backend:8000; proxy_read_timeout 1800s; proxy_buffering off; }
 location / { try_files $uri $uri/ /index.html; }
}
